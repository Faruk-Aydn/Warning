[versions]
agp = "8.9.2"
kotlin = "2.0.21"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.9.0"
activityCompose = "1.10.1"
composeBom = "2025.05.01"
mapsCompose = "4.4.3"
navigationCompose = "2.9.0"
room ="2.7.1"
roomRuntimeAndroid = "2.7.1"
google-service ="4.4.2"
firebaseFunctionsKtx = "22.0.1"
firebaseMessaging = "25.0.1"
appcompat = "1.7.1"

[libraries]
# maps
google-maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }
google-play-services-maps = { module = "com.google.android.gms:play-services-maps", version = "19.0.0" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
